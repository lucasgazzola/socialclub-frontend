# CI del frontend — en PRs a dev/test/main y push a dev.
# Sin tests (decisión del equipo): valida lint + typecheck + build.
name: CI

on:
  pull_request:
    branches: [dev, test, main]
  push:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
