# E2E — TASK-43. Flujos completos en el navegador contra el sistema real:
# este front + la API de socialclub-backend + Postgres (efímero, con
# migraciones y seed). No bloquea los PR: corre al integrar en dev y a mano.
#
# Deja dos artifacts:
# - playwright-report: reporte HTML con capturas por paso, video y trace.
# - evidencia-e2e: capturas y filas EJ en el formato del equipo, listas para
#   copiar a socialclub-backend/docs/pruebas (ver docs/pruebas/README.md).
name: E2E

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Rama o commit de socialclub-backend contra el que probar
        default: dev
      sprint:
        description: Sprint para el registro de ejecución (EJ)
        default: '4.0'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: socialclub
          POSTGRES_PASSWORD: socialclub
          POSTGRES_DB: socialclub_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U socialclub -d socialclub_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_BACKEND_DIR: ./backend
      E2E_DATABASE_URL: postgresql://socialclub:socialclub@localhost:5432/socialclub_e2e?schema=public
    steps:
      - uses: actions/checkout@v4

      - name: Checkout del backend
        uses: actions/checkout@v4
        with:
          repository: lucasgazzola/socialclub-backend
          ref: ${{ inputs.backend_ref || 'dev' }}
          path: backend

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Instalar dependencias (front y backend)
        run: |
          npm ci
          npm ci --prefix backend
          (cd backend && npx prisma generate)

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Pruebas E2E
        run: npx playwright test

      - name: Evidencia en el formato del equipo
        if: always()
        run: |
          node scripts/evidencia-e2e.mjs --docs=backend/docs/pruebas --registrar \
            --sprint="${{ inputs.sprint || '4.0' }}" --ejecutor="CI (Playwright)" || true

      - name: Publicar reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-e2e
          path: |
            backend/docs/pruebas/evidencias/*/e2e/
            backend/docs/pruebas/ejecucion.csv
          retention-days: 30
          if-no-files-found: warn
